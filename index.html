<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边缘加速空间</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); text-align: center; max-width: 400px; border: 1px solid rgba(255, 255, 255, 0.2); }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { color: #e0e0e0; font-size: 14px; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 12px 24px; background: white; color: #764ba2; border-radius: 30px; text-decoration: none; font-weight: bold; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 欢迎来到我的 Cloudflare Pages 站点 v2 </h1>
        <p>这是我通过 GitHub 自动构建并部署在全球 300 多个边缘节点上的极速静态网页！</p>
        <a href="https://xiaomingli.com" class="btn" target="_blank">访问我的 Nginx 主站</a>
    </div>
</body>
</html>
